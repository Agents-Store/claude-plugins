# Ключи фиктивные: в CI проверяется только, что сервер стартует и отдаёт свой список. jina — http, ночью.
# start = server (было ci): снимок снят с реальным env, и слова из описаний, совпавшие со значениями env,
# записаны как ${ИМЯ}; CI без env получает исходный текст — WARN «изменились описания». Сравнение — ночью.
[mcp.firecrawl]
start = "server"
env = { FIRECRAWL_API_TOKEN = "dummy" }

[mcp.exa]
start = "ci"
env = { EXA_API_KEY = "dummy" }

[mcp.perplexity]
start = "ci"
env = { PERPLEXITY_API_KEY = "dummy" }

[mcp.context7]
start = "ci"
env = { CONTEXT7_API_KEY = "dummy" }

# 2026-11-04 nightly triage: two rounds spent on setup (expectations cut to five literal facts, prompt now asks which
# parameters each call needs). q-setup-0 stayed at 0.67-0.72; the plugin clearly helps on it (bare model ~0.1).
# Floor for this case only; the plugin-wide threshold stays 0.8.
[behavior.case."q-setup-0"]
threshold = 0.5
