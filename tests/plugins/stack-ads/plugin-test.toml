# stack-ads: six official MCP servers, a toolkit with its own unit tests, one PreToolUse guard hook.
#
# MCP servers. Only dataforseo starts in CI: its tools/list needs no real credentials.
# firecrawl and apify are hosted http servers that want a real key: nightly on the server.
# The three ad-platform servers cannot be started by a test: google-ads needs an application-default
# credentials file of a real account and an approved Cloud project, meta-ads an Employee system-user
# token of a real business, tiktok-ads a browser OAuth sign-in. Their tool names are therefore not
# written into the skills; the skills name the servers and tell the agent to read the live tool list.
# The names the live TikTok and Meta servers listed on 2026-11-22 are kept in
# plugins/stack-ads/tests/fixtures/mcp-live-names.json: the hook's unit tests check its verdict on each of them.
[mcp.dataforseo]
start = "ci"
env = { DATAFORSEO_USERNAME = "dummy", DATAFORSEO_PASSWORD = "dummy" }

# snapshot = "names": the skills name these servers, never single tools, so a renamed or removed tool is all
# the snapshot has to catch; the long tool descriptions of a hosted server change weekly and would only add noise.
[mcp.firecrawl]
start = "server"
snapshot = "names"

[mcp.apify]
start = "server"
snapshot = "names"

[mcp.google-ads]
start = "never"

[mcp.meta-ads]
start = "never"

[mcp.tiktok-ads]
start = "never"

# The toolkit's own tests: guard rails, launch engine, model discovery, the hook, and the contract test that
# parses every documented command with the real parser. -B keeps bytecode out of the plugin tree.
[[unit]]
name = "stack-ads toolkit unittest"
run = "python3 -B -m unittest discover -s tests"
cwd = "plugins/stack-ads"
needs = ["python3"]
timeout = 300

# Upstream. The plugin was written on 2026-11-14 against Google Ads API v26, Meta Marketing API v27.0,
# TikTok Marketing API v1.3, Firecrawl v2, Apify v2, DataForSEO v3, the OpenAI Images API, the Gemini
# Interactions API and the fal.ai queue API. google-ads-mcp never starts in a test (see above), so it is
# watched here; google-ads (the Python client) is the earliest public signal of a new Google Ads API version,
# meta-ads is the official Meta command-line tool that the Meta launch reference documents.
[upstream]
reviewed = 2026-11-14
[[upstream.source]]
kind = "pypi"
id = "google-ads-mcp"
pinned = "0.0.6"
[[upstream.source]]
kind = "pypi"
id = "google-ads"
pinned = "35.1.0"
[[upstream.source]]
kind = "pypi"
id = "meta-ads"
pinned = "1.3.1"
