# vendored by scripts/sync-teams-sdk-skills.sh; fix upstream, not here.
# Every skills/teams-sdk-<name>/ directory is an rsync --delete mirror of an upstream skill (weekly
# sync-teams-sdk-skills.yml): a local edit is overwritten, and an upstream finding (an unlabelled json block,
# a link that only works in the upstream tree) would fail the sync pull request. The hand-written skills
# (no teams-sdk- prefix) stay checked.
[skip]
"skill-snippets" = ["skills/teams-sdk-*/*"]
"skill-links" = ["skills/teams-sdk-*/*"]

# L2: vendored teams-sdk skill; наборы срабатывания — отдельной задачей после калибровки.
"eval-coverage" = ["skills/teams-sdk-*/*"]

# Teams SDK 2.1.0 и Teams Developer CLI 3.0.3: плагин выверен по опубликованным пакетам (LEARNINGS 2026-10-03).
# Vendored — skills/teams-sdk-* (официальный skill microsoft/teams-sdk, синхронизируется скриптом).
[upstream]
skip_paths = ["skills/teams-sdk-*/*"]
[[upstream.source]]
kind = "npm"
id = "@microsoft/teams.apps"
pinned = "2.1.0"
[[upstream.source]]
kind = "npm"
id = "@microsoft/teams.cli"
pinned = "3.0.3"
[[upstream.source]]
kind = "docs"
url = "https://microsoft.github.io/teams-sdk/"
