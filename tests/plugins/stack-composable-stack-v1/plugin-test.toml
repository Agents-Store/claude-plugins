# start = server (было ci): снимок снят с реальным env, и слова из описаний, совпавшие со значениями env,
# записаны как ${ИМЯ}; CI без env получает исходный текст — WARN «изменились описания». Сравнение — ночью.
[mcp.trigger-dev]
start = "server"
env = { TRIGGER_ACCESS_TOKEN = "dummy", TRIGGER_API_URL = "https://trigger.example.com" }

# start = server (было ci): снимок снят с реальным env, и слова из описаний, совпавшие со значениями env,
# записаны как ${ИМЯ}; CI без env получает исходный текст — WARN «изменились описания». Сравнение — ночью.
[mcp.n8n-mcp-external]
start = "server"
env = { N8N_API_URL = "https://n8n.example.com", N8N_API_KEY = "dummy" }

# Self-hosted серверы: tools/list может нести имена баз и таблиц инстанса — в снимок только имена.
[mcp.n8n-native-mcp]
snapshot = "names"

[mcp.nocodb]
snapshot = "names"

[mcp.postgresql-mcp]
snapshot = "names"

[mcp.nocobase-dev]
snapshot = "names"

# Стек описывает архитектуру и версий продуктов в тексте не называет (LEARNINGS 2026-10-03, вариант A). Выверен по тем
# же версиям, что пять его технологических плагинов (n8n-dev, nocodb-ops, nocobase-dev, postgresql-external-dev,
# trigger-dev): n8n-mcp и trigger.dev — серверы из .mcp.json, остальное — сервисы, которые они соединяют.
# Vendored-путей нет.
[upstream]
[[upstream.source]]
kind = "github-release"
id = "n8n-io/n8n"
pinned = "2.41.6"
[[upstream.source]]
kind = "npm"
id = "n8n-mcp"
pinned = "2.91.0"
[[upstream.source]]
kind = "npm"
id = "trigger.dev"
pinned = "4.7.2"
[[upstream.source]]
