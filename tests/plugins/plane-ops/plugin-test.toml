# PreToolUse-hook решает, какие вызовы Plane MCP спрашивают подтверждение,
# поэтому его таблица разрушительных действий тестируется как код.
[[unit]]
name = "plane-ops hook unittest"
run = "python3 -W error::ResourceWarning -m unittest discover -s . -v"
cwd = "plugins/plane-ops/hooks"
needs = ["python3"]

# 2026-11-05 precise triage (kept answers + judge votes): facts that sit after roughly the first 1500 characters of an answer
# are judged far less often (about 50% against 85%), and per-case scores swing by up to 0.4 between quick runs of the same text.
# The cases below were rewritten to single literal facts ("says to ..."), got a brevity tail and still scored 0.4-0.8 over
# four quick runs (two rounds, R42). Per-case floors keep the nightly quiet; the plugin-wide threshold is untouched.
[behavior.case."q-connector-bootstrap-2"]
threshold = 0.5

[behavior.case."q-connector-bootstrap-7"]
threshold = 0.5

[behavior.case."q-daily-standup-2"]
threshold = 0.5

[behavior.case."q-epics-initiatives-milestones-6"]
threshold = 0.7

[behavior.case."q-estimation-1"]
threshold = 0.5

[behavior.case."q-modules-4"]
threshold = 0.7

[behavior.case."q-pages-publishing-7"]
threshold = 0.5

[behavior.case."q-sprint-planning-4"]
threshold = 0.5

[behavior.case."q-velocity-metrics-2"]
threshold = 0.5

[behavior.case."q-work-items-4"]
threshold = 0.5
