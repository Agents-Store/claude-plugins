# OAuth (вход через браузер): наш клиент токен не получает. Снимок — очередь 4 (дрейф).
[mcp.teleshop]
start = "never"

# Teleshop — облачный сервис: у MCP-сервера нет npm/PyPI-пакета и публичных релизов, версии нет. Плагин выверен
# по публичной странице MCP (в ней и в тексте плагина — 50 инструментов, 2026-11-14). Источник один — docs;
# pinned не задан, пока сервис не публикует номер версии. Вендоренных путей нет: skip_paths не нужен.
[upstream]
[[upstream.source]]
kind = "docs"
url = "https://teleshop.pro/en/mcp"
