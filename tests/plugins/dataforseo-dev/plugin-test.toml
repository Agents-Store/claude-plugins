# tools/list не требует настоящих учётных данных — сервер стартует в CI с фиктивными.
[mcp.dataforseo]
start = "ci"
env = { DATAFORSEO_USERNAME = "dummy", DATAFORSEO_PASSWORD = "dummy" }

# DataForSEO: плагин выверен по dataforseo-mcp-server 3.1.3 (npm, 2026-10-02) и документации API v3 (текст на 2026-10-04).
# Vendored-содержимого нет — skip_paths не нужен. Пакет ведётся и на GitHub (теги v3.x), но релизов там нет.
[upstream]
[[upstream.source]]
kind = "npm"
id = "dataforseo-mcp-server"
pinned = "3.1.3"
[[upstream.source]]
kind = "docs"
url = "https://docs.dataforseo.com/v3/"
