# gws-*, persona-*, recipe-* и SKILLS_INDEX.md — зеркало googleworkspace/cli, его перезаписывает
# еженедельный sync (см. LEARNINGS.md плагина). Руками их не правят: ссылки upstream
# (SKILLS_INDEX.md пишет `../skills/…` вместо `skills/…`, gws-chat ссылается на /chat/api/…) чинятся только апстримом.
[skip]
"skill-links" = ["SKILLS_INDEX.md", "skills/gws-*", "skills/persona-*", "skills/recipe-*"]
"skill-snippets" = ["skills/gws-*", "skills/persona-*", "skills/recipe-*"]

# L2: наборы срабатывания vendored skills — отдельной задачей после калибровки (spec очереди 2 §1).
"eval-coverage" = ["skills/gws-*", "skills/persona-*", "skills/recipe-*"]

# Плагин выверен по googleworkspace/cli 0.22.5 (npm и релиз GitHub, 2026-10-03): vendored-скиллы — зеркало тега v0.22.5.
# Зеркалятся еженедельной синхронизацией, поэтому refresh их не правит (skip_paths); свои — google-workspace-setup и examples.
[upstream]
skip_paths = ["skills/gws-*/*", "skills/persona-*/*", "skills/recipe-*/*", "SKILLS_INDEX.md", "LICENSE"]
[[upstream.source]]
kind = "npm"
id = "@googleworkspace/cli"
pinned = "0.22.5"
[[upstream.source]]
kind = "github-release"
id = "googleworkspace/cli"
pinned = "v0.22.5"
