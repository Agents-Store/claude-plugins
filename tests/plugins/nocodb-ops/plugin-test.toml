# Self-hosted сервер: tools/list может нести данные инстанса — в снимок только имена.
[mcp.nocodb]
snapshot = "names"

# NocoDB: плагин выверен по релизу NocoDB 2026.10.2 (до 2026-11: 2026.09.1) (LEARNINGS 2026-10: контракт MCP Community и Cloud/licensed,
# записи пачками по 100, фильтры v3). Пакет `nocodb` в npm давно не обновляется (0.301.x) — версию ведёт только
# GitHub-релиз. Официальный скрипт nocodb.sh живёт в nocodb/agent-skills и не вендорится.
# Vendored-путей нет: skip_paths пуст.
[upstream]
skip_paths = []
reviewed = 2026-11-24
[[upstream.source]]
kind = "github-release"
id = "nocodb/nocodb"
