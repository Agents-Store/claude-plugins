# 2026-11-04 nightly triage: two rounds spent on postgres-mcp-tools (expectations cut to five literal facts, prompt asks for
# the SQL "once I have confirmed"). q-postgres-mcp-tools-2 still scores 0.50-0.67 because the skill rightly stops at the
# confirmation-and-backup gate before a DROP. Floor only for this case; the plugin-wide threshold stays 0.8.

[behavior.case."q-postgres-mcp-tools-2"]
threshold = 0.5

# postgresql-external-dev: aligned with MCP Toolbox for Databases 1.13.1 (postgres-mcp-tools, 29 tools, checked 2026-10-02),
# PostgREST 16.3 (postgrest-api, recipes run on 16.3; text applies to 14-16) and NocoDB 2026.09.1 (compatible-platforms,
# column-types, create-tables). NocoBase has no GitHub release the text is tied to: its external-database docs are the source.
# PostgreSQL itself is tracked through its docs (version matrix 14-18). No vendored paths: skip_paths is empty.
# The plugin ships no .mcp.json, so mcp-list does not cover the Toolbox server; the release source does.
[upstream]
skip_paths = []
[[upstream.source]]
kind = "github-release"
id = "googleapis/mcp-toolbox"
pinned = "1.13.1"
[[upstream.source]]
kind = "github-release"
id = "PostgREST/postgrest"
pinned = "16.3"
[[upstream.source]]
kind = "github-release"
id = "nocodb/nocodb"
pinned = "2026.09.1"
[[upstream.source]]
kind = "docs"
url = "https://docs.nocobase.com"
[[upstream.source]]
kind = "docs"
url = "https://www.postgresql.org/docs/"
