name: Sync to cross-CLI mirrors

# Triggers the cross-cli-converter and pushes per-CLI output to 5 mirror repos.
# Source-of-truth: this repo (claude-public-plugins). Mirrors are auto-generated.
#
# Required secret: MIRROR_PUSH_TOKEN
#   Fine-grained PAT with `contents: write` on:
#     - Agents-Store/cross-cli-converter  (read)
#     - Agents-Store/cursor-plugins        (write)
#     - Agents-Store/codex-plugins         (write)
#     - Agents-Store/gemini-extensions     (write)
#     - Agents-Store/antigravity-skills    (write)
#     - Agents-Store/opencode-plugins      (write)

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/sync-cross-cli.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated targets (cursor,codex,gemini,antigravity,opencode) or "all"'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cli: cursor
            repo: cursor-plugins
          - cli: codex
            repo: codex-plugins
          - cli: gemini
            repo: gemini-extensions
          - cli: antigravity
            repo: antigravity-skills
          - cli: opencode
            repo: opencode-plugins
    env:
      CLI: ${{ matrix.cli }}
      REPO: ${{ matrix.repo }}
      REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'all' }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPO: ${{ github.repository }}
      TRIGGER_EVENT: ${{ github.event_name }}
    steps:
      - name: Decide whether to run this target
        id: filter
        run: |
          if [ "$REQUESTED_TARGETS" = "all" ] || echo ",$REQUESTED_TARGETS," | grep -q ",$CLI,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping $CLI (not in requested targets: $REQUESTED_TARGETS)"
          fi

      - name: Checkout source (claude-public-plugins)
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout converter
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: Agents-Store/cross-cli-converter
          path: converter
          token: ${{ secrets.MIRROR_PUSH_TOKEN }}

      - name: Checkout mirror target
        if: steps.filter.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: Agents-Store/${{ matrix.repo }}
          path: mirror
          token: ${{ secrets.MIRROR_PUSH_TOKEN }}

      - name: Setup Node.js
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: converter/package-lock.json

      - name: Install converter dependencies
        if: steps.filter.outputs.run == 'true'
        working-directory: converter
        run: npm ci

      - name: Wipe mirror plugin directories (preserve root metadata + .git)
        if: steps.filter.outputs.run == 'true'
        working-directory: mirror
        run: |
          # Remove all top-level subdirectories EXCEPT .git
          # Root files (README, LICENSE, .gitignore) are kept
          find . -maxdepth 1 -mindepth 1 -type d ! -name '.git' -exec rm -rf {} +

      - name: Run converter
        if: steps.filter.outputs.run == 'true'
        working-directory: converter
        run: |
          npx tsx src/index.ts \
            --source "$GITHUB_WORKSPACE/source/plugins" \
            --target "$CLI" \
            --out "$GITHUB_WORKSPACE/mirror"

      - name: Commit and push to mirror
        if: steps.filter.outputs.run == 'true'
        working-directory: mirror
        run: |
          git config user.name 'agents-store-bot'
          git config user.email 'bot@agents.store'
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::No changes for $CLI; nothing to push."
            exit 0
          fi
          PLUGIN_COUNT=$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.git' | wc -l | tr -d ' ')
          FILE_COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          SHORT_SHA="${SOURCE_SHA:0:7}"
          git commit -m "chore: sync from claude-public-plugins@${SHORT_SHA}

          Source: ${SOURCE_REPO}@${SOURCE_SHA}
          Triggered by: ${TRIGGER_EVENT}
          Plugins: ${PLUGIN_COUNT}  |  Files changed: ${FILE_COUNT}
          Generated by: Agents-Store/cross-cli-converter"
          git push
          echo "::notice::Pushed $FILE_COUNT file change(s) across $PLUGIN_COUNT plugin(s) to $REPO"
